kind = "web"
previewPath = "/"
title = "PixelLab"
description = "An interactive computer graphics learning lab for college students, with step-by-step visualizations of classic drawing, transformation, and clipping algorithms."
version = "1.0.0"
id = "artifacts/pixel-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23396

[services.development]
run = "pnpm --filter @workspace/pixel-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pixel-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/pixel-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23396"
BASE_PATH = "/"
